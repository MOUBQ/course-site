<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>致 娇姐 · 写在深夜</title>
  <meta name="description" content="写给娇姐的一封信，写在深夜。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- 夜空里几粒轻眨的星 -->
  <div class="sky" aria-hidden="true">
    <span class="star" style="left:12%;top:18%;animation-delay:.4s"></span>
    <span class="star" style="left:78%;top:12%;animation-delay:1.2s"></span>
    <span class="star" style="left:30%;top:34%;animation-delay:2.1s"></span>
    <span class="star bright" style="left:66%;top:28%;animation-delay:.9s"></span>
    <span class="star" style="left:88%;top:44%;animation-delay:1.8s"></span>
    <span class="star" style="left:20%;top:62%;animation-delay:2.6s"></span>
  </div>

  <main class="page">

    <!-- 开头：始终可见 -->
    <header class="opening">
      <h1 class="greet">娇姐，见字如面。</h1>
      <p class="lead">有一些话，想在夜里，认真说给你听。</p>
      <button class="light-btn" id="lightBtn" type="button">
        <span class="dot"></span>点亮 · 读给你听
      </button>
    </header>

    <!-- 被点亮的信 -->
    <section class="letter" id="letter" aria-live="polite">

      <div class="glow" aria-hidden="true"></div>

      <div class="body">
        <p>有些话，白天说不出口，只好借这夜的安静，认真写给你。</p>
        <p>遇见你之前，日子只是日子；遇见你之后，才发觉，一个人能让寻常的一天也发光。</p>
        <p>你会记住我随口一提的小事，会在我手忙脚乱时，笑着拉我一把。<span class="ring">看你笑起来的样子，是我整天的光。</span></p>
        <p>所以，我不只想走进你的世界里，更想站在你身边，陪你把往后的每一个起落，都走稳。</p>
      </div>

      <p class="core">
        娇姐，我喜欢你。<br />
        往后的路，让我陪你走，好不好？
      </p>

      <div class="ask">
        <p class="q">你愿意，给我这个机会吗？</p>
        <div class="actions">
          <button class="btn btn-yes" id="btnYes" type="button">愿意呀</button>
          <button class="btn btn-wait" id="btnWait" type="button">再想想</button>
        </div>
        <p class="reply" id="reply"></p>
      </div>

      <p class="signature">
        <span class="thin" aria-hidden="true"></span>
        <span class="name">你的强哥哥</span>
      </p>

    </section>

  </main>

  <footer>写于深夜 · 心里装着你</footer>

  <script>
    var letter = document.getElementById('letter');

    // 一共只点亮一次
    document.getElementById('lightBtn').addEventListener('click', function () {
      this.classList.add('open');
      letter.classList.add('open');
      var self = this;
      setTimeout(function () { self.style.display = 'none'; }, 1200);
      letter.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    var replyBox = document.getElementById('reply');

    document.getElementById('btnYes').addEventListener('click', function () {
      replyBox.textContent = '谢谢你，娇姐。这句话，我是认真的。';
      replyBox.classList.add('show');
    });

    document.getElementById('btnWait').addEventListener('click', function () {
      replyBox.textContent = '好。不着急，我把这封信，留在这里等你。';
      replyBox.classList.add('show');
    });
  </script>

</body>
</html>
